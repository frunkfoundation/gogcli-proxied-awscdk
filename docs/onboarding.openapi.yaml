openapi: 3.1.0
info:
  title: Managed Google account connections and caller inventory
  version: 2.0.0
  description: Owner routes use the existing Authentik session. Mutations require canonical Origin and session CSRF.
    POST account commands require scoped idempotency keys; terminal diagnostics and replay results are retained
    for seven days, while account state has no TTL. Incomplete commands return 202 with Location. Restrictive changes
    remain applying at least 65 seconds after writes. Google consent and caller access are separate. Secrets and
    provider response bodies are never returned.
servers:
- url: https://gp-039168171bf05570eadba6a8.k-rae.com/prd/onboarding
security:
- OwnerSession: []
paths:
  /auth/login:
    get:
      summary: Start owner sign-in; return to the configured owner page
      security: []
      responses:
        '303':
          description: Redirect to configured Authentik provider
        default:
          $ref: '#/components/responses/Problem'
  /auth/callback:
    get:
      summary: Complete browser-bound owner login
      security: []
      parameters:
      - name: state
        in: query
        required: true
        schema: &id001
          type: string
      - name: code
        in: query
        schema: *id001
      - name: error
        in: query
        schema: *id001
      responses:
        '303':
          description: Set secure HttpOnly owner cookie and redirect to setup
        default:
          $ref: '#/components/responses/Problem'
  /oauth/google/callback:
    get:
      summary: Consume one session-bound Google consent attempt
      description: Uses state, PKCE and nonce. An ambiguous code exchange is never repeated. Candidate validation
        preserves installed credentials on failure. Expired owner sessions return to owner sign-in and fresh consent.
        Codes and tokens are never returned.
      parameters:
      - name: state
        in: query
        required: true
        schema: *id001
      - name: code
        in: query
        schema: *id001
      - name: error
        in: query
        schema: *id001
      responses:
        '303':
          description: Fixed setup redirect with nonsecret operation or recovery information
        default:
          $ref: '#/components/responses/Problem'
  /v1/setup:
    get:
      summary: Read saved project context and independent account progress
      responses:
        '200':
          description: Saved nonsecret state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
        default:
          $ref: '#/components/responses/Problem'
    put:
      summary: Select the shared default project
      responses:
        '200':
          description: Saved nonsecret state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
        default:
          $ref: '#/components/responses/Problem'
      parameters: &id002
      - &id005
        $ref: '#/components/parameters/Origin'
      - &id006
        $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultProjectId: *id001
              required:
              - defaultProjectId
  /v1/projects/{projectId}/oauth-client:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    put:
      summary: Import an immutable revision of a Google Web client
      responses:
        '200':
          description: Saved nonsecret state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
        default:
          $ref: '#/components/responses/Problem'
      parameters: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                web:
                  type: object
                  properties:
                    client_id: *id001
                    client_secret:
                      type: string
                      writeOnly: true
                    project_id: *id001
                    redirect_uris:
                      type: array
                      items:
                        type: string
                        format: uri
                  required:
                  - client_id
                  - client_secret
                  - project_id
                  - redirect_uris
              required:
              - web
  /v1/projects/{projectId}/setup:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    put:
      summary: Record revision-bound publishing and API confirmations
      responses:
        '200':
          description: Saved nonsecret state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
        default:
          $ref: '#/components/responses/Problem'
      parameters: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientRevision: *id001
                publishingConfirmed: &id003
                  type: boolean
                apiConfirmed:
                  type: object
                  properties:
                    gmail: *id003
                    drive: *id003
                    calendar: *id003
              required:
              - clientRevision
              - publishingConfirmed
              - apiConfirmed
  /v1/accounts/{email}:
    parameters:
    - $ref: '#/components/parameters/Email'
    put:
      summary: Save account project and requested services
      responses:
        '200':
          description: Saved nonsecret state
          content: &id004
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          $ref: '#/components/responses/Problem'
        '201':
          description: Saved new account metadata; connection requires separate consent.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content: *id004
      parameters: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId: *id001
                services: &id007
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                    - gmail
                    - drive
                    - calendar
              required:
              - projectId
              - services
  /v1/accounts/{email}/enrollments:
    parameters:
    - $ref: '#/components/parameters/Email'
    post:
      summary: Accept, replay, continue, or explicitly restart account consent
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Problem'
      parameters: &id008
      - *id005
      - *id006
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId: *id001
                services: *id007
                ownerAccessEnabled: *id003
                restart: *id003
              required:
              - projectId
              - services
              - ownerAccessEnabled
      description: Continue reuses the original key and exact body supplied by owner setup. An unused new key during
        unexpired same-session consent returns 409; explicit restart uses a fresh key and restart:true. No consent
        URL appears in ordinary setup. Google URLs are returned only for the bound action.
  /v1/accounts/{email}/verifications:
    parameters:
    - $ref: '#/components/parameters/Email'
    post:
      summary: Check saved authorization and each installed service
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Problem'
      parameters: *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /v1/accounts/{email}/recoveries:
    parameters:
    - $ref: '#/components/parameters/Email'
    post:
      summary: Recover saved candidate artifacts into a fresh operation
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Problem'
      parameters: *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /v1/accounts/{email}/access:
    parameters:
    - $ref: '#/components/parameters/Email'
    put:
      summary: Apply configured owner caller access without changing Google consent
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Problem'
      parameters: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: *id003
              required:
              - enabled
  /v1/accounts/{email}/connection:
    parameters:
    - $ref: '#/components/parameters/Email'
    delete:
      summary: Durably remove proxy credentials and managed caller entries
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        default:
          $ref: '#/components/responses/Problem'
        '204':
          description: Proxy connection already absent; no unfinished removal work.
      parameters: *id002
  /v1/operations/{operationId}:
    parameters:
    - $ref: '#/components/parameters/OperationId'
    get:
      summary: Read retained operation diagnostics
      responses:
        '200':
          description: Saved nonsecret state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          $ref: '#/components/responses/Problem'
  /proxy/v1/accounts:
    servers:
    - url: https://gp-039168171bf05570eadba6a8.k-rae.com/prd
    get:
      summary: Read metadata visible to the authenticated caller
      responses:
        '200':
          description: Saved nonsecret state
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryAccount'
                  setup_url:
                    type: string
                    format: uri
                required:
                - accounts
                - setup_url
        default:
          description: Proxy or gateway admission error. Caller access and IAM/usage-plan checks precede account
            metadata reads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
      security:
      - SigV4: []
        UsagePlanKey: []
      description: AWS SigV4 and usage-plan key are both required. No Google routing/account headers or secret reads.
        Metadata visibility does not grant all service operations.
components:
  securitySchemes:
    OwnerSession:
      type: apiKey
      in: cookie
      name: __Host-gog-owner
    SigV4:
      type: apiKey
      in: header
      name: Authorization
      description: AWS Signature Version 4, service execute-api, region us-east-2. API Gateway verifies the IAM
        principal.
    UsagePlanKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Usage-plan admission; not caller identity.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: *id001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: *id001
    Email:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
    OperationId:
      name: operationId
      in: path
      required: true
      schema: *id001
  responses:
    Accepted:
      description: Persisted command accepted; resume by polling Location
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    Problem:
      description: Safe RFC 9457 error; 409 means stale revision, conflicting account work, or operator-managed
        permission conflict. 401 provides fixed owner login URL.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri
              title: *id001
              status:
                type: integer
              detail: *id001
              loginUrl:
                type: string
                format: uri
            required:
            - type
            - title
            - status
            - detail
  schemas:
    ServiceStatus:
      type: object
      properties:
        name:
          type: string
          enum:
          - gmail
          - drive
          - calendar
        authorization_status:
          type: string
          enum:
          - granted
          - missing
        last_verification_status: *id001
        last_verified_at:
          type: integer
      required:
      - name
      - authorization_status
      - last_verification_status
      - last_verified_at
    InventoryAccount:
      type: object
      properties:
        email:
          type: string
          format: email
        connection_status: *id001
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
      required:
      - email
      - connection_status
      - services
    Account:
      allOf:
      - $ref: '#/components/schemas/InventoryAccount'
      - type: object
        properties:
          selected_project_id: *id001
          installed_project_id: *id001
          requested_services: *id007
          owner_access_enabled: *id003
          latest_operation:
            anyOf:
            - $ref: '#/components/schemas/Operation'
            - type: 'null'
          recovery_available:
            type: boolean
    Operation:
      type: object
      properties:
        id: *id001
        kind: *id001
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - accepted
          - running
          - succeeded
          - failed
          - canceled
        phase: *id001
        error_code: *id001
        recovery: *id001
        created_at:
          type: integer
        updated_at:
          type: integer
        promoted_at:
          type: integer
        verified_at:
          type: integer
        authorization_written_at:
          type: integer
        propagation_complete_at:
          type: integer
        consent_expires_at:
          type: integer
        authorizationUrl:
          type: string
          format: uri
          description: Returned only for current consent continuation, never logged or stored by clients.
        continuation_key:
          type: string
          description: 'Owner setup only: original nonsecret command key for consent continuation.'
        continuation_request:
          type: object
          description: 'Owner setup only: exact original enrollment body to reuse with continuation_key.'
        consent_session_matches:
          type: boolean
          description: 'Owner setup only: whether Continue is bound to the current owner session.'
      required:
      - id
      - kind
      - email
      - status
      - phase
    Setup:
      type: object
      properties:
        csrfToken: *id001
        callbackUrl:
          type: string
          format: uri
        proxyUrl:
          type: string
          format: uri
        setupUrl:
          type: string
          format: uri
        defaultProjectId: *id001
        ownerCallerArn: *id001
        serviceOptions:
          type: array
          items:
            type: object
            properties:
              name: *id001
              label: *id001
              apiName: *id001
              scope: *id001
              description: *id001
        projects:
          type: array
          items:
            type: object
            properties:
              projectId: *id001
              clientConfigured: *id003
              clientRevision: *id001
              clientId: *id001
              publishingConfirmed: *id003
              apiConfirmed:
                type: object
                properties:
                  gmail: *id003
                  drive: *id003
                  calendar: *id003
              recordedClientType: *id001
              recordedClientId: *id001
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
